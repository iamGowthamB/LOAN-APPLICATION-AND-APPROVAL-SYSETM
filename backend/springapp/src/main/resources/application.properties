//Loan Application and Approval System

spring.application.name=springapp
#production database configuration
# spring.datasource.url=
# spring.datasource.username=
# spring.datasource.password=

#development database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/loanapp?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
file.upload-dir=uploads


# Logging configuration
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR


jwt.secret=ThisIsA32CharacterLongSecretKey12345
jwt.expirationMillis=3600000


# -----------------------------
# Email configuration
# -----------------------------

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=loanappsystem@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8



